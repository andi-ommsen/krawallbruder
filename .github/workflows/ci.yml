name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: krawallbruder
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: kb_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb_user -d krawallbruder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kb_user:kb_secret@127.0.0.1:5432/krawallbruder?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer audit --locked

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
