name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: krawallbruder
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: kb_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb_user -d krawallbruder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kb_user:kb_secret@127.0.0.1:5432/krawallbruder?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: composer test
      - run: composer audit --locked

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, frontend-build]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.REMOTE_APP_PATH }}

            # Code aktualisieren
            git pull origin master

            # Docker Images bauen und Container neu starten
            # --env-file: Variablen für docker-compose Substitution (${VAR}) UND Container
            VITE_API_URL=${{ secrets.VITE_API_URL }} \
            docker compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache

            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            # Kurz warten bis PHP-Container bereit ist
            sleep 5
            docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T php \
              php bin/console doctrine:migrations:migrate --no-interaction --env=prod

            # Alte Images aufräumen
            docker image prune -f
